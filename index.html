<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>文综冲刺 · 客观题特训</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="社会·法治中考客观题冲刺：主动回忆＋即时解析＋间隔重复。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=20260531c" />
</head>
<body>
  <main id="screen" aria-live="polite"><!-- 由 app.js 渲染当前页面 --></main>

  <!-- 全局轻提示（连对、徽章、降级警告） -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 题库为普通脚本，定义 window.QUESTIONS / window.SUBJECTIVE，避免 file:// 下 fetch 的 CORS 问题 -->
  <script src="questions.js?v=20260531c"></script>
  <script src="app.js?v=20260531c"></script>

  <!-- 注册 Service Worker：首次联网后缓存整套 App，之后断网/弱网也能用（碎片时间刚需） -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
